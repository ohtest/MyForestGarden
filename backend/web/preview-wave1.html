<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>山谷之声 · 波次1验收</title>
  <style>
    :root {
      --cream: #FDF6EC;
      --ink: #5C5348;
      --muted: #8A8074;
      --soft: #B7A99A;
      --peach: #E8A87C;
      --peach2: #F2C4A0;
      --paper: #FFFDF8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 10%, rgba(232,168,124,.25), transparent 40%),
        linear-gradient(160deg, #f7efe3, #e8dfd2 55%, #d9cfc0);
      font-family: "Yuanti SC", "STYuanti", "PingFang SC", sans-serif;
      color: var(--ink);
    }
    .phone {
      width: 390px;
      height: 780px;
      border-radius: 36px;
      background: var(--cream);
      box-shadow: 0 30px 80px rgba(74,69,60,.25);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 8px solid #3a342c;
    }
    .notch {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--soft);
      font-size: 11px;
      letter-spacing: .12em;
    }
    .screen { flex: 1; overflow: hidden; position: relative; }
    .panel {
      position: absolute;
      inset: 0;
      padding: 12px 20px 16px;
      overflow: auto;
      display: none;
    }
    .panel.on { display: block; }
    .eyebrow { font-size: 12px; color: var(--soft); letter-spacing: .2em; margin-bottom: 8px; }
    .title { font-size: 30px; margin: 0 0 10px; color: #4A453C; }
    .desc { color: var(--muted); line-height: 1.7; font-size: 14px; margin-bottom: 24px; white-space: pre-wrap; }
    .chat-shell {
      height: calc(100% - 8px);
      display: flex;
      flex-direction: column;
      background: #FAE9DA;
      border-radius: 28px;
      overflow: hidden;
    }
    .chat-hero {
      padding: 14px;
      text-align: center;
    }
    .pill {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(232,168,124,.35);
      color: var(--soft);
      font-size: 11px;
    }
    .msgs { flex: 1; padding: 8px 14px; overflow: auto; }
    .row { display: flex; gap: 8px; margin-top: 10px; align-items: flex-start; }
    .row.user { justify-content: flex-end; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--peach2) url("/art/tuantuan/tuantuan-default.jpg") center/cover;
      flex-shrink: 0;
    }
    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px 16px 16px 4px;
      background: var(--paper);
      line-height: 1.65;
      font-size: 15px;
      white-space: pre-wrap;
    }
    .user .bubble {
      background: linear-gradient(135deg, var(--peach2), var(--peach));
      color: var(--paper);
      border-radius: 16px 16px 4px 16px;
    }
    .composer {
      display: flex; gap: 10px; align-items: center;
      padding: 10px 14px 16px;
      background: rgba(250,233,218,.94);
    }
    .composer input {
      flex: 1; border: 0; outline: 0;
      border-radius: 999px; padding: 10px 16px;
      background: #F1D9C3; color: var(--ink); font-size: 15px;
    }
    .send {
      width: 38px; height: 38px; border-radius: 50%; border: 0;
      background: linear-gradient(135deg, var(--peach2), var(--peach));
      color: white; font-size: 16px; cursor: pointer;
    }
    .btn {
      width: 100%; height: 48px; border: 0; border-radius: 999px;
      font-size: 15px; cursor: pointer; font-family: inherit; margin: 0;
    }
    .btn.primary { background: linear-gradient(135deg, #c9a86c, #e2c48a); color: #2a2038; font-weight: 500; }
    .btn.ghost { background: rgba(255,255,255,.08); color: rgba(232,224,245,.85); border: 1px solid rgba(212,188,138,.35); }
    /* 答案之书 · 深紫烫金古书预览 */
    #book.panel { padding: 0; background: #0a0818; color: #e8e0f5; overflow: hidden; }
    .bk-stage { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .bk-bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 90% 60% at 50% 42%, rgba(72,48,120,.55), transparent 68%),
        radial-gradient(ellipse 50% 35% at 20% 75%, rgba(40,55,120,.35), transparent 70%),
        linear-gradient(180deg, #14102a 0%, #0c0a1c 48%, #070612 100%);
    }
    .bk-glow {
      position: absolute; left: 50%; top: 42%; width: 240px; height: 240px;
      transform: translate(-50%,-50%); border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(212,168,90,.16) 0%, rgba(120,80,180,.08) 42%, transparent 70%);
      animation: bk-glow 5.5s ease-in-out infinite;
    }
    @keyframes bk-glow { 0%,100% { opacity:.75; transform:translate(-50%,-50%) scale(.96); } 50% { opacity:1; transform:translate(-50%,-50%) scale(1.04); } }
    .bk-fog {
      position: absolute; border-radius: 50%; filter: blur(32px); pointer-events: none;
      animation: bk-fog 16s ease-in-out infinite alternate;
    }
    .bk-fog.a { width: 220px; height: 140px; left: -30px; top: 20%; background: rgba(130,100,190,.22); }
    .bk-fog.b { width: 200px; height: 130px; right: -20px; bottom: 18%; background: rgba(70,100,170,.18); animation-duration: 20s; }
    .bk-fog.c { width: 160px; height: 100px; left: 32%; top: 58%; background: rgba(200,160,100,.08); animation-duration: 18s; }
    @keyframes bk-fog { to { transform: translate(20px, -14px); } }
    .bk-particles { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
    .bk-dot {
      position: absolute; border-radius: 50%;
      background: radial-gradient(circle, #f5e6b8 0%, transparent 70%);
      box-shadow: 0 0 6px rgba(245,210,140,.5);
      animation: bk-dot ease-in-out infinite;
    }
    @keyframes bk-dot {
      0%,100% { transform: translateY(0) scale(1); opacity: .2; }
      50% { transform: translateY(-18px) scale(1.2); opacity: .9; }
    }
    .bk-inner {
      position: relative; z-index: 2; width: 100%; height: 100%;
      padding: 0; box-sizing: border-box;
    }
    #bkIdle, #bkFlip {
      position: absolute; left: 50%; top: 43%; transform: translate(-50%, -50%);
      width: 78%; max-width: 280px; z-index: 3;
    }
    #bkIdle { display: flex; flex-direction: column; align-items: center; }
    .bk-book {
      width: 100%; aspect-ratio: 3/4; max-height: 66vh;
      min-width: 200px; min-height: 268px; cursor: pointer; position: relative;
    }
    .bk-book.breathe { animation: bk-breathe-scale 4.8s ease-in-out infinite; }
    .bk-book.pulse { animation: bk-pulse .5s cubic-bezier(.34,1.2,.64,1); }
    @keyframes bk-breathe-scale {
      0%,100% { transform: translateY(0) scale(.98); }
      50% { transform: translateY(-10px) scale(1.02); }
    }
    @keyframes bk-pulse {
      45% { filter: brightness(1.28); box-shadow: 0 0 40px rgba(245,210,140,.55), 0 0 70px rgba(140,100,210,.35); }
    }
    .bk-cover {
      width: 100%; height: 100%; border-radius: 8px 12px 12px 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background:
        linear-gradient(145deg, rgba(245,220,160,.18) 0%, transparent 38%),
        linear-gradient(180deg, #3b2a62 0%, #2a1d4a 42%, #1a1232 100%);
      border: 1.5px solid rgba(226,196,138,.65);
      box-shadow:
        0 20px 44px rgba(0,0,0,.5), 0 0 28px rgba(180,140,80,.12),
        inset 0 0 0 8px rgba(212,188,138,.1);
      color: #f3d9a0; letter-spacing: .36em; font-size: 22px; position: relative; overflow: hidden;
    }
    .bk-cover::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(115deg, transparent 32%, rgba(245,220,160,.22) 48%, transparent 64%);
      background-size: 240% 100%; animation: bk-foil 6s ease-in-out infinite;
    }
    @keyframes bk-foil { 0%,100% { background-position: 130% 0; } 50% { background-position: -30% 0; } }
    .bk-sigil { font-size: 14px; letter-spacing: .22em; margin-top: 12px; opacity: .8; position: relative; z-index: 1; }
    .bk-guide {
      position: absolute; left: 0; right: 0; top: 78%;
      text-align: center; z-index: 3;
      font-size: 13px; letter-spacing: .14em; color: rgba(230,218,245,.78);
      animation: bk-breathe 2.8s ease-in-out infinite;
    }
    @keyframes bk-breathe { 0%,100% { opacity: .35; } 50% { opacity: .95; } }
    .bk-flip-wrap { width: 100%; aspect-ratio: 3/4; max-height: 68vh; display: flex; flex-direction: column; align-items: center; }
    .bk-flip {
      width: 100%; flex: 1; position: relative; perspective: 1600px; perspective-origin: 50% 45%;
      transform-style: preserve-3d; min-height: 240px;
    }
    .bk-bed { position: absolute; inset: 0; transform-style: preserve-3d; }
    .bk-bed-page {
      position: absolute; inset: 0; border-radius: 8px 12px 12px 8px;
      background: linear-gradient(105deg, rgba(255,255,255,.25), transparent 30%), linear-gradient(180deg, #f3ebe0, #e5d9c6);
      border: 1px solid rgba(170,150,110,.35); box-shadow: 0 12px 28px rgba(0,0,0,.35);
    }
    .bk-bed-page.p2 { transform: translate3d(2px,3px,-4px); opacity: .92; }
    .bk-bed-page.p3 {
      transform: translate3d(4px,6px,-8px); opacity: .88;
      background: linear-gradient(180deg, #3b2a62, #1a1232); border-color: rgba(226,196,138,.35);
    }
    .bk-page {
      position: absolute; inset: 0; border-radius: 6px 10px 10px 6px;
      transform-origin: left center; transform-style: preserve-3d;
      opacity: 0; font-size: 16px;
      --end-y: -178deg; --mid-y: -92deg; --curl: 0deg; --lift: 18px;
      --ease: cubic-bezier(.22,.72,.28,1); --flip-ms: 400ms;
    }
    .bk-page.on {
      opacity: 1;
      animation: bk-paper-flip var(--flip-ms) var(--ease) forwards;
    }
    @keyframes bk-paper-flip {
      0% { transform: rotateY(0) rotateZ(0) translateZ(0); }
      18% { transform: rotateY(-32deg) rotateZ(calc(var(--curl) * .6)) translateZ(calc(var(--lift) * .35)); }
      48% { transform: rotateY(var(--mid-y)) rotateZ(var(--curl)) translateZ(var(--lift)); }
      78% { transform: rotateY(-145deg) rotateZ(calc(var(--curl) * .4)) translateZ(calc(var(--lift) * .45)); }
      100% { transform: rotateY(var(--end-y)) rotateZ(calc(var(--curl) * -.25)) translateZ(2px); }
    }
    .bk-sheet {
      position: absolute; inset: 0; transform-style: preserve-3d; border-radius: 6px 10px 10px 6px;
    }
    .bk-face {
      position: absolute; inset: 0; border-radius: 6px 10px 10px 6px;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .bk-face.front {
      background: linear-gradient(105deg, rgba(255,255,255,.4), transparent 32%), linear-gradient(180deg, #f8f2e8, #e2d4be);
      border: 1px solid rgba(180,160,120,.45);
      box-shadow: 0 12px 28px rgba(0,0,0,.32); color: rgba(70,55,90,.38); letter-spacing: .45em; filter: blur(3px);
    }
    .bk-face.back {
      background: linear-gradient(180deg, #e6dccb, #d4c6b0); transform: rotateY(180deg);
      border: 1px solid rgba(150,130,95,.35);
    }
    .bk-thick {
      position: absolute; left: 0; top: 1%; bottom: 1%; width: 5px;
      transform: translateX(-50%) rotateY(90deg); transform-origin: center;
      background: linear-gradient(180deg, #f0e6d4, #a89068); opacity: .15;
    }
    .bk-page.on .bk-thick { animation: bk-thick var(--flip-ms) var(--ease) forwards; }
    @keyframes bk-thick { 0%,100% { opacity: .1; } 45% { opacity: .9; } }
    .bk-cast {
      position: absolute; left: 4%; right: -6%; top: 6%; bottom: 4%; border-radius: 8px;
      background: radial-gradient(ellipse at left center, rgba(0,0,0,.45), transparent 70%);
      transform-origin: left center; filter: blur(8px); opacity: .2; z-index: -1;
    }
    .bk-page.on .bk-cast { animation: bk-cast var(--flip-ms) var(--ease) forwards; }
    @keyframes bk-cast {
      0% { opacity: .2; transform: scaleX(1); }
      45% { opacity: .7; transform: scaleX(.55) translateX(8%); }
      100% { opacity: .05; transform: scaleX(.2); }
    }
    .bk-page.on .bk-face.front { animation: bk-shade var(--flip-ms) var(--ease) forwards; }
    @keyframes bk-shade { 0% { filter: blur(3px) brightness(1.05); } 40% { filter: blur(3px) brightness(1.12); } 100% { filter: blur(3.5px) brightness(.55); } }
    .bk-hint { margin-top: 14px; font-size: 12px; color: rgba(230,218,245,.55); letter-spacing: .16em; animation: bk-breathe 1.6s ease-in-out infinite; }
    .bk-result {
      position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
      width: 90%; max-width: 310px; z-index: 4;
      display: flex; flex-direction: column; align-items: center;
      animation: bk-in .6s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes bk-in { from { opacity: 0; transform: translate(-50%, -46%) scale(.92); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    .bk-card {
      position: relative; width: 100%; min-height: 210px; border-radius: 16px; overflow: visible;
      background: linear-gradient(165deg, #f7f1e6, #ebe2d2);
      border: 1px solid rgba(212,188,138,.5);
      box-shadow: 0 18px 44px rgba(0,0,0,.42);
      animation: bk-sheet-in .55s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes bk-sheet-in { from { opacity: 0; transform: translateY(12px) scale(.94); } }
    .bk-body {
      position: relative; z-index: 2; padding: 24px 100px 28px 20px; min-height: 180px;
      display: flex; flex-direction: column; align-items: flex-start; justify-content: center; box-sizing: border-box;
    }
    .bk-mascot {
      position: absolute; right: -6px; bottom: -14px; width: 110px; height: 140px; z-index: 3;
      pointer-events: none; animation: bk-otter-in .7s cubic-bezier(.22,1.2,.36,1) .15s both;
    }
    @keyframes bk-otter-in { from { opacity: 0; transform: translate(8px, 12px) scale(.86); } }
    .bk-mascot-glow {
      position: absolute; left: 50%; top: 55%; width: 100px; height: 100px;
      transform: translate(-50%,-50%); border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(245,210,140,.4), rgba(140,100,200,.1) 50%, transparent 72%);
      animation: bk-otter-glow 2.8s ease-in-out infinite;
    }
    @keyframes bk-otter-glow { 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); } }
    .bk-otter {
      position: relative; z-index: 1; width: 110px; height: 140px; object-fit: contain;
      filter: drop-shadow(0 6px 10px rgba(40,30,60,.28));
      animation: bk-otter-float 3.6s ease-in-out .7s infinite;
    }
    @keyframes bk-otter-float { 50% { transform: translateY(-5px); } }
    .bk-label { font-size: 11px; letter-spacing: .35em; color: rgba(100,85,70,.55); margin-bottom: 14px; }
    .bk-line { position: relative; display: inline-flex; flex-wrap: wrap; justify-content: flex-start; font-size: 22px; color: #3a2f4a; line-height: 1.6; }
    .bk-char { opacity: 0; transform: translateY(6px); transition: opacity .35s cubic-bezier(.22,1,.36,1), transform .35s cubic-bezier(.22,1,.36,1); }
    .bk-char.on { opacity: 1; transform: none; }
    .bk-shine {
      position: absolute; inset: -4px -16px; pointer-events: none;
      background: linear-gradient(105deg, transparent 30%, rgba(245,220,160,.45) 50%, transparent 70%);
      background-size: 220% 100%; animation: bk-shine 2.4s cubic-bezier(.4,0,.2,1) .4s 2;
      mix-blend-mode: soft-light;
    }
    @keyframes bk-shine { to { background-position: -40% 0; } }
    .bk-actions { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .bk-hidden { display: none !important; }
    .card {
      background: var(--paper);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 12px;
      border: 1px solid rgba(232,168,124,.25);
    }
    .card.locked { border-style: dashed; border-color: rgba(183,169,154,.55); opacity: .9; }
    .kicker { font-size: 11px; color: var(--soft); margin-bottom: 6px; }
    .card h3 { margin: 0 0 8px; font-size: 20px; font-weight: 500; }
    .card p { margin: 0; color: var(--muted); line-height: 1.7; font-size: 14px; }
    .tabbar {
      height: 64px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border-top: 1px solid rgba(183,169,154,.25);
      background: var(--cream);
    }
    .tab {
      border: 0; background: transparent; cursor: pointer;
      color: var(--soft); font-size: 11px; font-family: inherit;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    }
    .tab.on { color: var(--peach); }
    .tab .ico { font-size: 18px; line-height: 1; }
    .note {
      position: fixed; left: 24px; bottom: 24px; max-width: 280px;
      background: rgba(255,253,248,.92); padding: 12px 14px; border-radius: 14px;
      font-size: 12px; color: var(--muted); line-height: 1.6;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    .splash {
      position: absolute; inset: 0; z-index: 30; background: #F7F1E6; overflow: hidden;
      transition: opacity .45s ease;
    }
    .splash.leave { opacity: 0; pointer-events: none; }
    .splash img {
      width: 100%; height: 100%; object-fit: cover; opacity: 0;
      transform: translateY(30px) scale(.95);
      animation: splash-in 1.8s cubic-bezier(.22,1,.36,1) forwards, splash-breathe 2.4s ease-in-out 1.8s infinite;
    }
    .splash-tone {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      mix-blend-mode: soft-light;
    }
    .splash.tone-morning .splash-tone {
      background: linear-gradient(180deg, rgba(255,214,180,.35), rgba(255,236,210,.12) 45%, rgba(255,200,160,.2));
    }
    .splash.tone-midday .splash-tone {
      background: linear-gradient(180deg, rgba(255,248,220,.28), rgba(255,255,255,.05) 40%, rgba(255,220,140,.18));
    }
    .splash.tone-afternoon .splash-tone {
      background: linear-gradient(180deg, rgba(255,200,120,.22), rgba(232,168,100,.16) 50%, rgba(200,120,80,.22));
    }
    .splash.tone-evening .splash-tone {
      background: linear-gradient(180deg, rgba(80,60,120,.28), rgba(120,80,140,.2) 40%, rgba(40,30,70,.35));
      mix-blend-mode: multiply;
    }
    .splash.tone-late .splash-tone {
      background: linear-gradient(180deg, rgba(20,24,48,.45), rgba(30,28,60,.35) 50%, rgba(10,12,28,.55));
      mix-blend-mode: multiply;
    }
    .splash-caption {
      position: absolute; left: 0; right: 0; bottom: 12%; z-index: 3;
      text-align: center; font-size: 14px; letter-spacing: .2em;
      color: rgba(255,250,240,.92); text-shadow: 0 1px 8px rgba(40,30,20,.45);
      opacity: 0; animation: splash-caption-in 1.2s ease .4s both;
    }
    .splash.tone-morning .splash-caption,
    .splash.tone-midday .splash-caption,
    .splash.tone-afternoon .splash-caption {
      color: rgba(90,70,50,.85); text-shadow: 0 1px 6px rgba(255,255,255,.5);
    }
    .splash-fx {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background-image: radial-gradient(circle, rgba(255,214,140,.7) 1px, transparent 1.8px);
      background-size: 22px 28px;
      animation: splash-rise 3s linear infinite;
    }
    @keyframes splash-in { to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes splash-breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-2px) scale(1.012); }
    }
    @keyframes splash-rise {
      from { background-position: 0 20px; }
      to { background-position: 6px -20px; }
    }
    @keyframes splash-caption-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="notch">山谷之声 · 波次1验收</div>
    <div class="screen">
      <div class="splash" id="splash">
        <img id="splashArt" alt="开屏" src="/art/tuantuan/splash/splash-01-sunny.jpg" />
        <div class="splash-tone" id="splashTone"></div>
        <div class="splash-fx"></div>
        <div class="splash-caption" id="splashCaption"></div>
      </div>
      <section class="panel on" id="chat">
        <div class="chat-shell">
          <div class="chat-hero"><span class="pill" id="hourPill">午后了</span></div>
          <div class="msgs" id="msgs"></div>
          <div class="composer">
            <input id="draft" placeholder="嗯，我在听" maxlength="200" />
            <button class="send" id="sendBtn" type="button">↑</button>
          </div>
        </div>
      </section>

      <section class="panel" id="book">
        <div class="bk-stage">
          <div class="bk-bg"></div>
          <div class="bk-glow"></div>
          <div class="bk-fog a"></div>
          <div class="bk-fog b"></div>
          <div class="bk-fog c"></div>
          <div class="bk-particles" id="bkParticles"></div>
          <div class="bk-inner">
            <div class="bk-guide" id="bkGuide">轻触书本，寻找你的答案</div>
            <div id="bkIdle">
              <div class="bk-book breathe" id="bkBook" role="button" tabindex="0">
                <div class="bk-cover">答案之书<div class="bk-sigil">☽ · ✦ · ☾</div></div>
              </div>
            </div>
            <div id="bkFlip" class="bk-hidden">
              <div class="bk-flip-wrap">
                <div class="bk-flip">
                  <div class="bk-bed">
                    <div class="bk-bed-page"></div>
                    <div class="bk-bed-page p2"></div>
                    <div class="bk-bed-page p3"></div>
                  </div>
                  <div class="bk-page" id="bkPage">
                    <div class="bk-cast"></div>
                    <div class="bk-sheet">
                      <div class="bk-face front" id="bkPageText">······</div>
                      <div class="bk-thick"></div>
                      <div class="bk-face back"></div>
                    </div>
                  </div>
                </div>
                <div class="bk-hint">命运正在检索…</div>
              </div>
            </div>
            <div id="bkResult" class="bk-result bk-hidden">
              <div class="bk-card">
                <div class="bk-body">
                  <div class="bk-label">你的答案</div>
                  <div class="bk-line" id="bkLine"><span class="bk-shine"></span></div>
                </div>
                <div class="bk-mascot">
                  <div class="bk-mascot-glow"></div>
                  <img class="bk-otter" src="/art/book/tuantuan-wizard-reveal.png" alt="团团巫师" />
                </div>
              </div>
              <div class="bk-actions">
                <button class="btn primary" id="againBtn" type="button">再问一次</button>
                <button class="btn ghost" id="goChatBtn" type="button">带着答案去聊聊</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel" id="explore">
        <div class="eyebrow">山谷之声</div>
        <h1 class="title">自我探索</h1>
        <p class="desc">用一张卡，或一段字，轻轻看见自己。</p>
        <div class="card">
          <div class="kicker">即将到来 · 波次 2</div>
          <h3>OH 卡</h3>
          <p>抽一张图像，看看它先碰到你哪里。没有标准答案。</p>
        </div>
        <div class="card">
          <div class="kicker">即将到来 · 波次 2</div>
          <h3>山谷日记</h3>
          <p>写一点 → 听见 → 投射点评 → 支持。写完也可以去聊聊。</p>
        </div>
        <div class="card locked">
          <div class="kicker">绑定后开放 · 波次 3</div>
          <h3>沙盘推演</h3>
          <p>在山谷里摆一盘，留下画面，再做一轮轻推演。</p>
        </div>
      </section>
    </div>
    <nav class="tabbar">
      <button class="tab on" data-tab="chat" type="button"><span class="ico">💬</span>陪我聊聊</button>
      <button class="tab" data-tab="book" type="button"><span class="ico">📖</span>答案之书</button>
      <button class="tab" data-tab="explore" type="button"><span class="ico">⛰</span>自我探索</button>
    </nav>
  </div>
  <div class="note">这是波次1界面验收页（与小程序同结构）。开发者工具若仍卡网络，可先在这里验收交互与文案。</div>
  <script src="/answers-book.js"></script>
  <script>
    const ANSWERS = window.ANSWER_BOOK_POOL || ["慢慢来，不着急", "你已经够好了"];
    const BLUR = ["······","正在翻阅","命运低语","轻轻翻页","星尘落定"];
    const FLIP_DURATIONS = [260, 320, 400, 520, 700];
    const FLIP_GAPS = [220, 270, 340, 450, 620];
    const FLIP_EASES = [
      "cubic-bezier(0.22, 0.72, 0.28, 1)",
      "cubic-bezier(0.18, 0.85, 0.32, 1)",
      "cubic-bezier(0.25, 0.6, 0.2, 1)",
      "cubic-bezier(0.15, 0.78, 0.35, 0.98)",
    ];
    function rand(min, max) { return min + Math.random() * (max - min); }
    const YEAR_MS = 365 * 24 * 60 * 60 * 1000;
    const GUEST_KEY = "vv_answer_book_guest";
    /** 预览页：localStorage 模拟绑定。控制台执行 localStorage.setItem('vv_user_id','demo') 可测一年不重复 */
    function getBoundUserId() {
      return localStorage.getItem("vv_user_id") || "";
    }
    function drawAnswer() {
      const bound = !!getBoundUserId();
      const key = bound ? `vv_answer_book_user_${getBoundUserId()}` : GUEST_KEY;
      const now = Date.now();
      let state;
      try { state = JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) { state = {}; }
      if (!state.used || typeof state.used !== "object") state.used = {};
      if (bound) {
        const pruned = {};
        Object.keys(state.used).forEach((id) => {
          if (now - Number(state.used[id]) <= YEAR_MS) pruned[id] = state.used[id];
        });
        state.used = pruned;
      }
      const available = [];
      for (let i = 0; i < ANSWERS.length; i++) {
        if (!(String(i) in state.used)) available.push(i);
      }
      let index;
      if (available.length) {
        index = available[Math.floor(Math.random() * available.length)];
      } else if (bound) {
        const ids = Object.keys(state.used).sort((a, b) => state.used[a] - state.used[b]);
        index = Number(ids[0]) || 0;
      } else {
        state.used = {};
        index = Math.floor(Math.random() * ANSWERS.length);
      }
      state.used[String(index)] = now;
      localStorage.setItem(key, JSON.stringify(state));
      return ANSWERS[index];
    }
    let current = "";
    let bookBusy = false;
    const h = new Date().getHours();
    const hourLabel = h >= 5 && h < 10 ? "清晨了" : h >= 10 && h < 17 ? "午后了" : h >= 17 && h < 19 ? "傍晚了" : "夜里了";
    document.getElementById("hourPill").textContent = hourLabel;

    const particles = document.getElementById("bkParticles");
    for (let i = 0; i < 28; i++) {
      const d = document.createElement("div");
      d.className = "bk-dot";
      const size = 2 + Math.floor(Math.random() * 3);
      d.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;animation-delay:${Math.random()*4}s;animation-duration:${5+Math.random()*5}s;opacity:${0.25+Math.random()*0.5}`;
      particles.appendChild(d);
    }

    const SPLASH_FILE = {
      sunny: "splash-01-sunny.jpg", rain: "splash-02-rain.jpg", snow: "splash-03-snow.jpg",
      wind: "splash-04-wind.jpg", cloudy: "splash-05-cloudy.jpg", storm: "splash-06-storm.jpg",
      fog: "splash-07-fog.jpg", heat: "splash-08-heat.jpg",
    };
    const SPLASH_SLOT_LABEL = {
      morning: "早上", midday: "中午", afternoon: "下午", evening: "晚上", late: "深夜",
    };
    /** 开屏五段：早 5–11 / 中 11–14 / 下午 14–17 / 晚上 17–23 / 深夜 23–5 */
    function splashSlot(hour) {
      if (hour >= 5 && hour < 11) return "morning";
      if (hour >= 11 && hour < 14) return "midday";
      if (hour >= 14 && hour < 17) return "afternoon";
      if (hour >= 17 && hour < 23) return "evening";
      return "late";
    }
    function splashPick(hour) {
      const slot = splashSlot(hour);
      // 验收页无实时天气：按时段默认天气氛围，可用 ?sky=rain 等覆盖
      const q = new URLSearchParams(location.search);
      const sky = q.get("sky") || ({
        morning: "clear", midday: "clear", afternoon: "clear", evening: "cloudy", late: "fog",
      }[slot]);
      let kind = "sunny";
      if (sky === "snow") kind = "snow";
      else if (sky === "storm" || (sky === "rain" && (slot === "evening" || slot === "late"))) kind = "storm";
      else if (sky === "rain") kind = "rain";
      else if (sky === "fog" || (slot === "late" && (sky === "cloudy" || sky === "partly"))) kind = "fog";
      else if (sky === "cloudy" || sky === "partly") kind = "cloudy";
      else if (slot === "midday") kind = "heat";
      else if (slot === "afternoon") kind = "wind";
      else if (slot === "evening") kind = "cloudy";
      else if (slot === "late") kind = "fog";
      else kind = "sunny";
      const weatherLabel = { sunny: "晴", rain: "雨", snow: "雪", wind: "有风", cloudy: "阴", storm: "暴雨", fog: "雾", heat: "炎热" }[kind] || "晴";
      return {
        slot,
        kind,
        file: SPLASH_FILE[kind],
        caption: `${SPLASH_SLOT_LABEL[slot]} · ${weatherLabel}`,
      };
    }
    const splash = document.getElementById("splash");
    const splashArt = document.getElementById("splashArt");
    const pick = splashPick(h);
    splash.className = "splash tone-" + pick.slot;
    splashArt.src = "/art/tuantuan/splash/" + pick.file;
    document.getElementById("splashCaption").textContent = pick.caption;
    function finishSplash() {
      if (splash.classList.contains("leave")) return;
      splash.classList.add("leave");
      setTimeout(() => {
        splash.remove();
        const msgs = document.getElementById("msgs");
        msgs.innerHTML = `<div class="row"><div class="avatar"></div><div class="bubble">我在这里。你想说什么都可以</div></div>`;
      }, 460);
    }
    splash.addEventListener("click", finishSplash);
    setTimeout(finishSplash, 4200);

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("on"));
        document.querySelectorAll(".panel").forEach((p) => p.classList.remove("on"));
        tab.classList.add("on");
        document.getElementById(tab.dataset.tab).classList.add("on");
      });
    });

    function showPhase(name) {
      document.getElementById("bkIdle").classList.toggle("bk-hidden", name !== "idle");
      document.getElementById("bkFlip").classList.toggle("bk-hidden", name !== "flipping");
      document.getElementById("bkResult").classList.toggle("bk-hidden", name !== "result");
      const guide = document.getElementById("bkGuide");
      if (guide) guide.classList.toggle("bk-hidden", name !== "idle");
    }
    async function runBook() {
      if (bookBusy) return;
      bookBusy = true;
      const book = document.getElementById("bkBook");
      book.classList.remove("breathe");
      book.classList.add("pulse");
      if (navigator.vibrate) navigator.vibrate(30);
      current = drawAnswer();
      await new Promise((r) => setTimeout(r, 500));
      showPhase("flipping");
      const page = document.getElementById("bkPage");
      const pageText = document.getElementById("bkPageText");
      for (let i = 0; i < 5; i++) {
        const dur = Math.round(FLIP_DURATIONS[i] + rand(-45, 55));
        const gap = Math.round(FLIP_GAPS[i] + rand(-35, 40));
        pageText.textContent = BLUR[Math.floor(Math.random() * BLUR.length)];
        page.style.setProperty("--flip-ms", dur + "ms");
        page.style.setProperty("--end-y", Math.round(rand(-186, -168)) + "deg");
        page.style.setProperty("--mid-y", Math.round(rand(-102, -86)) + "deg");
        page.style.setProperty("--curl", rand(-1.2, 1.2).toFixed(2) + "deg");
        page.style.setProperty("--lift", Math.round(rand(14, 28)) + "px");
        page.style.setProperty("--ease", FLIP_EASES[Math.floor(Math.random() * FLIP_EASES.length)]);
        page.classList.remove("on");
        void page.offsetWidth;
        page.classList.add("on");
        await new Promise((r) => setTimeout(r, gap));
      }
      await new Promise((r) => setTimeout(r, 220));
      showPhase("result");
      const line = document.getElementById("bkLine");
      line.innerHTML = '<span class="bk-shine"></span>';
      [...current].forEach((ch, i) => {
        const span = document.createElement("span");
        span.className = "bk-char";
        span.textContent = ch;
        line.appendChild(span);
        setTimeout(() => span.classList.add("on"), 420 + i * 70);
      });
      bookBusy = false;
    }
    document.getElementById("bkBook").onclick = runBook;
    document.getElementById("againBtn").onclick = () => {
      if (bookBusy) return;
      document.getElementById("bkBook").classList.add("breathe");
      document.getElementById("bkBook").classList.remove("pulse");
      showPhase("idle");
    };
    document.getElementById("goChatBtn").onclick = () => {
      const msgs = document.getElementById("msgs");
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<div class="avatar"></div><div class="bubble">你翻到：「${current}」\n\n想从这里说说吗？我在。</div>`;
      msgs.appendChild(row);
      msgs.scrollTop = msgs.scrollHeight;
      document.querySelector('[data-tab="chat"]').click();
    };

    async function send() {
      const input = document.getElementById("draft");
      const text = input.value.trim();
      if (!text) return;
      const msgs = document.getElementById("msgs");
      const user = document.createElement("div");
      user.className = "row user";
      user.innerHTML = `<div class="bubble">${text}</div>`;
      msgs.appendChild(user);
      input.value = "";
      const wait = document.createElement("div");
      wait.className = "row";
      wait.innerHTML = `<div class="avatar"></div><div class="bubble">…</div>`;
      msgs.appendChild(wait);
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        wait.querySelector(".bubble").textContent = data.reply || data.detail || "暂时连不上。";
      } catch {
        wait.querySelector(".bubble").textContent = "暂时连不上。";
      }
      msgs.scrollTop = msgs.scrollHeight;
    }
    document.getElementById("sendBtn").onclick = send;
    document.getElementById("draft").addEventListener("keydown", (e) => {
      if (e.key === "Enter") send();
    });
  </script>
</body>
